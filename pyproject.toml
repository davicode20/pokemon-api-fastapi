[project]
name = "pokemon-api-fastapi"
version = "1.0.0"
description = "API REST com FastAPI para consulta de dados de Pokémon, com cache Redis, rate limiting e autenticação via API Key."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "redis==8.1.0",
    "requests==2.34.2",
    "python-dotenv==1.2.4",
    "pydantic==2.14.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.taskipy.tasks]
dev = "uvicorn main:app --reload"
lint = "ruff check ."
format = "ruff format ."